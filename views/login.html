<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#111315">
<title>Masuk ke panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<main class="login">
  <form id="f" autocomplete="on">
    <div>
      <h1>Masuk ke panel</h1>
      
    </div>
    <label class="sr" for="pw">Password</label>
    <input id="pw" class="field" type="password" placeholder="Password" autocomplete="current-password" required autofocus>
    <p class="err" id="err" role="alert"></p>
    <button class="btn primary" id="go" type="submit">Masuk</button>
    <div id="tgbox" hidden>
      <p class="login-or">atau</p>
      <button class="btn login-tg" id="tg" type="button">Masuk dengan Telegram</button>
      <p class="login-wait" id="tgmsg" role="status"></p>
    </div>
  </form>
</main>
<script src="/assets/login.js"></script>
</body>
</html>
